global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs: [{targets: ['localhost:9090']}]

  # Spark streaming metrics pushed after every micro-batch
  - job_name: pushgateway
    honor_labels: true
    static_configs: [{targets: ['pushgateway:9091']}]

  - job_name: producer
    static_configs: [{targets: ['producer:8001']}]

  - job_name: model-server
    metrics_path: /metrics/
    static_configs: [{targets: ['model-server:8000']}]
