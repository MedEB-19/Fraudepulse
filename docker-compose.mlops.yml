# Optional: MLflow tracking server. Then set MLFLOW_TRACKING_URI=http://mlflow:5000 in .env
#   docker compose -f docker-compose.yml -f docker-compose.mlops.yml up -d
volumes:
  mlflow_data:

services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.13.0
    container_name: mlflow
    restart: unless-stopped
    ports: ["5000:5000"]
    volumes: [mlflow_data:/mlflow]
    networks: [fraudpulse_net]
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts --serve-artifacts
